[package]
name = "pra_cli_rs"
version = "0.1.0"
edition = "2021"
description = "Rust CLI for Academic Paper Checker — incrementally replacing Python backend modules"

[[bin]]
name = "pra-cli-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
zip = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["json"] }

# opt-level = 2 instead of 3: rustc 1.96.0 LLVM 22 on this CPU produces
# SIMD instructions that SIGILL/access-violate with opt-level=3+s (seen in
# miniz_oxide and regex-automata).  Drop back to 3 after a toolchain update
# or when building on a different machine.
[profile.release]
opt-level = 2
